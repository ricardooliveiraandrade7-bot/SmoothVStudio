<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SmoothVStudio</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><main class="app-container">

    <header class="app-header">

        <h1>SmoothVStudio</h1>

        <p>
            Vocal processing studio
        </p>

    </header>


    <section class="panel audio-section">

        <label
            class="input-label"
            for="audioFile"
        >
            Áudio
        </label>

        <input
            id="audioFile"
            class="audio-input"
            type="file"
            accept="audio/*"
        >

        <div
            class="file-name"
            id="fileName"
        >
            Nenhum arquivo selecionado
        </div>


        <div class="player-block">

            <h2>Original</h2>

            <audio
                id="originalPlayer"
                controls
                preload="metadata"
            ></audio>

            <div class="time-display">

                <span id="originalCurrent">
                    00:00
                </span>

                <span id="originalDuration">
                    00:00
                </span>

            </div>

        </div>


        <div class="processing-controls">

            <button
                id="processButton"
                class="process-button"
                type="button"
                disabled
            >
                Processar
            </button>

            <button
                id="reprocessButton"
                type="button"
                disabled
            >
                Reprocessar
            </button>

        </div>


        <div class="status">

            <span id="processingStatus">
                Aguardando áudio.
            </span>

        </div>

    </section>


    <section
        id="processedSection"
        class="panel processed-panel hidden"
    >

        <div class="plugin-header">

            <div>

                <h2>Processado</h2>

                <p>
                    Processamento neutro nesta fase.
                </p>

            </div>

        </div>


        <audio
            id="processedPlayer"
            controls
            preload="metadata"
        ></audio>


        <div class="time-display">

            <span id="processedCurrent">
                00:00
            </span>

            <span id="processedDuration">
                00:00
            </span>

        </div>


        <div class="comparison">

            <button
                id="bypassButton"
                type="button"
                disabled
            >
                Bypass: Original
            </button>

        </div>


        <div class="export-controls">

            <button
                id="downloadButton"
                class="download-button"
                type="button"
                disabled
            >
                Exportar WAV
            </button>

            <button
                id="shareButton"
                class="share-button hidden"
                type="button"
            >
                Compartilhar
            </button>

        </div>


        <div class="download-status">

            <span id="downloadStatus"></span>

        </div>

    </section>

</main>

<script
    src="js/analyzer/vocal-softener-analyzer.js"
    defer
></script>

<script
    src="js/smoother/eq-signature.js"
    defer
></script>

<script
    src="js/smoother/vocal-softener.js"
    defer
></script>

<script
    src="js/smoother/air-reverb.js"
    defer
></script>

<script
    src="js/audio-engine.js"
    defer
></script>

<script
    src="js/wav-exporter.js"
    defer
></script>

<script
    src="js/file-downloader.js"
    defer
></script>

<script
    src="js/export/export-manager.js"
    defer
></script>

<script
    src="js/app.js"
    defer
></script>

</body></html>
