<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#101216"
    >

    <title>
        SmoothVStudio
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="app">


        <header class="header">

            <h1>
                SmoothVStudio
            </h1>

            <p>
                Vocal Smoother — processamento vocal offline
            </p>

        </header>


        <section class="panel">

            <h2>
                Áudio
            </h2>


            <label
                class="input-label"
                for="audioFile"
            >
                Selecione seu vocal
            </label>


            <input
                id="audioFile"
                class="audio-input"
                type="file"
                accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac"
            >


            <div
                id="fileName"
                class="file-name"
            >
                Nenhum arquivo selecionado.
            </div>


            <audio
                id="originalPlayer"
                controls
                preload="metadata"
            ></audio>


            <div class="time-display">

                <span id="originalCurrent">
                    00:00
                </span>

                <span id="originalDuration">
                    00:00
                </span>

            </div>

        </section>


        <section
            class="panel smoother-panel"
        >


            <div class="plugin-header">

                <div>

                    <h2>
                        Vocal Smoother
                    </h2>

                    <p>
                        Suavização vocal inteligente
                    </p>

                </div>


                <span class="version">
                    V0.5
                </span>

            </div>


            <button
                id="processButton"
                class="process-button"
                type="button"
                disabled
            >
                Processar Vocal
            </button>


            <div
                id="processingStatus"
                class="status"
            >
                Aguardando áudio.
            </div>


            <div
                id="processedSection"
                class="hidden"
            >


                <h2>
                    Resultado
                </h2>


                <audio
                    id="processedPlayer"
                    controls
                    preload="metadata"
                ></audio>


                <div class="time-display">

                    <span id="processedCurrent">
                        00:00
                    </span>

                    <span id="processedDuration">
                        00:00
                    </span>

                </div>


                <div class="comparison">


                    <button
                        id="bypassButton"
                        type="button"
                    >
                        Bypass: Original
                    </button>


                    <button
                        id="reprocessButton"
                        type="button"
                    >
                        Processar novamente
                    </button>


                </div>


                <button
                    id="downloadButton"
                    class="download-button"
                    type="button"
                    disabled
                >
                    Salvar WAV 24-bit
                </button>


                <button
                    id="shareButton"
                    class="share-button hidden"
                    type="button"
                >
                    Compartilhar WAV
                </button>


                <div
                    id="downloadStatus"
                    class="download-status"
                ></div>


            </div>


        </section>


        <section class="panel">


            <h2>
                Motor
            </h2>


            <div class="engine-info">


                <div>

                    <span>
                        Processamento
                    </span>

                    <strong>
                        Offline
                    </strong>

                </div>


                <div>

                    <span>
                        Exportação
                    </span>

                    <strong>
                        WAV 24-bit
                    </strong>

                </div>


                <div>

                    <span>
                        Análise
                    </span>

                    <strong>
                        Adaptativa
                    </strong>

                </div>


            </div>


        </section>


    </main>

    <!-- =====================================
         SMOOTHVSTUDIO
         MÓDULOS DE ANÁLISE E PLANEJAMENTO

</body>
