<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmoothVStudio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app-container">

        <header class="app-header">

            <h1>SmoothVStudio</h1>

            <p>
                Vocal processing studio
            </p>

        </header>


        <section class="audio-section">

            <input
                id="audioFileInput"
                type="file"
                accept="audio/*"
            >

            <div class="file-info">

                <span id="fileName">
                    Nenhum arquivo selecionado
                </span>

            </div>


            <div class="controls">

                <button
                    id="playButton"
                    type="button"
                    disabled
                >
                    Reproduzir
                </button>


                <button
                    id="pauseButton"
                    type="button"
                    disabled
                >
                    Pausar
                </button>


                <button
                    id="stopButton"
                    type="button"
                    disabled
                >
                    Parar
                </button>

            </div>


            <div class="processing-controls">

                <button
                    id="processButton"
                    type="button"
                    disabled
                >
                    Processar
                </button>


                <button
                    id="bypassButton"
                    type="button"
                    disabled
                >
                    Bypass
                </button>

            </div>


            <div class="export-controls">

                <button
                    id="exportButton"
                    type="button"
                    disabled
                >
                    Exportar WAV
                </button>


                <button
                    id="shareButton"
                    type="button"
                    disabled
                >
                    Compartilhar
                </button>

            </div>


            <div class="status">

                <span id="statusText">
                    Pronto
                </span>

            </div>

        </section>

    </main>


    <script
        src="js/audio-engine.js"
        defer
    ></script>

    <script
        src="js/wav-exporter.js"
        defer
    ></script>

    <script
        src="js/file-downloader.js"
        defer
    ></script>

    <script
        src="js/export/export-manager.js"
        defer
    ></script>

    <script
        src="js/app.js"
        defer
    ></script>

</body>

</html>
